<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hands-Free Attendance Kiosk</title>
    <script defer src="./face-api.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { margin-bottom: 5px; color: #1a1a1a; font-size: 24px; }
        #statusText {
            font-weight: 600;
            margin: 15px 0;
            color: #555;
            padding: 10px;
            border-radius: 6px;
            background: #f0f2f5;
            font-size: 16px;
        }
        #videoContainer {
            display: none;
            margin: 20px 0;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            max-width: 500px;
            display: block;
            transition: opacity 0.4s ease;
        }
        .panel {
            border-top: 1px solid #eee;
            margin-top: 20px;
            padding-top: 20px;
            text-align: left;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #0070f3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover { background: #0061d1; }
        .register-headline { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>Face Recognition Kiosk</h1>
    <div id="statusText">⏳ Initializing local AI models...</div>

    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="registerPanel" class="panel" style="display: none;">
        <div class="register-headline">👤 Add New Employee Profile</div>
        <div class="input-group">
            <label for="userId">Employee ID</label>
            <input type="text" id="userId" placeholder="e.g. EMP101">
        </div>
        <div class="input-group">
            <label for="userName">Full Name</label>
            <input type="text" id="userName" placeholder="e.g. Ajay Shah">
        </div>
        <button id="registerBtn">Scan & Save Face</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('statusText');
    const videoContainer = document.getElementById('videoContainer');
    const registerPanel = document.getElementById('registerPanel');

    let db;
    let isModelsLoaded = false;
    let isCameraRunning = false;

    // Proximity Engine Variables
    let motionCanvas = document.createElement('canvas');
    let motionCtx = motionCanvas.getContext('2d');
    let lastFrameData = null;
    let motionDetectionInterval;
    const MOTION_THRESHOLD = 25; // Pixel color difference boundary sensitivity

    // 1. Initialize Local Storage (IndexedDB Architecture)
    const dbRequest = indexedDB.open("AttendanceDB", 1);
    dbRequest.onupgradeneeded = (e) => {
        const localDb = e.target.result;
        if (!localDb.objectStoreNames.contains("users")) {
            localDb.createObjectStore("users", { keyPath: "id" });
        }
        if (!localDb.objectStoreNames.contains("logs")) {
            localDb.createObjectStore("logs", { autoIncrement: true });
        }
    };
    dbRequest.onsuccess = (e) => {
        db = e.target.result;
        console.log("📦 Local IndexedDB Ready.");
        loadModelsSequentially();
    };

    // 2. Load Weight Shards into Memory Sequentially
    async function loadModelsSequentially() {
        const MODEL_URL = './models/';
        try {
            statusText.innerText = "⏳ Loading Facial Tracking Core (1/3)...";
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            
            statusText.innerText = "⏳ Mapping Landmark Structural Contours (2/3)...";
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            
            statusText.innerText = "⏳ Calibrating Vector Feature Extractors (3/3)...";
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            isModelsLoaded = true;
            registerPanel.style.display = 'block';
            
            // Auto-ignite camera directly into low-power tracking mode on load
            wakeUpCamera("verify");
        } catch (err) {
            console.error("Model failure:", err);
            statusText.innerText = "❌ Neural net initialization error. Check your models folder.";
        }
    }

    // 3. Hardware Activation Controls (With Standby Sensing Mode)
    async function wakeUpCamera(mode = "verify") {
        isCameraRunning = true;
        statusText.innerText = "⚡ Initializing hardware lens...";
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            });
            
            video.srcObject = stream;
            videoContainer.style.display = 'block';
            
            if (mode === "verify") {
                startProximitySensing(stream);
            } else if (mode === "register") {
                statusText.innerText = "Camera Preview Ready. Align your face and click 'Scan & Save Face' to capture!";
            }
        } catch (err) {
            console.error(err);
            statusText.innerText = "Camera access error. Grant system hardware allowances.";
            isCameraRunning = false;
        }
    }

    // 4. Low-Power Proximity Sensor Loop (Pixel Change Delta Verification)
    function startProximitySensing(stream) {
        statusText.innerText = "💤 Standby Mode. Watching for movement...";
        video.style.opacity = "0.15"; // Reduce brightness rendering feedback profile
        
        motionCanvas.width = 32;
        motionCanvas.height = 24;

        motionDetectionInterval = setInterval(() => {
            if (!isCameraRunning) return clearInterval(motionDetectionInterval);

            motionCtx.drawImage(video, 0, 0, 32, 24);
            const currentFrameData = motionCtx.getImageData(0, 0, 32, 24).data;

            if (lastFrameData) {
                let changedPixels = 0;
                
                for (let i = 0; i < currentFrameData.length; i += 4) {
                    const rDiff = Math.abs(currentFrameData[i] - lastFrameData[i]);
                    const gDiff = Math.abs(currentFrameData[i+1] - lastFrameData[i+1]);
                    const bDiff = Math.abs(currentFrameData[i+2] - lastFrameData[i+2]);
                    
                    if ((rDiff + gDiff + bDiff) / 3 > MOTION_THRESHOLD) {
                        changedPixels++;
                    }
                }

                // If more than 15% of the micro matrix array moves, wake up AI processing
                if (changedPixels > (32 * 24 * 0.15)) {
                    console.log("🏃‍♂️ Proximity motion detected! Starting AI scan...");
                    clearInterval(motionDetectionInterval);
                    video.style.opacity = "1.0";
                    
                    runFaceVerification(stream); 
                }
            }
            
            lastFrameData = currentFrameData;
        }, 400); // Poll frames gently 2.5 times a second to drop battery overhead
    }

    // 5. User Registration Pipeline (ONE-CLICK PREVIEW SAVING)
    document.getElementById('registerBtn').addEventListener('click', async () => {
        const id = document.getElementById('userId').value.trim();
        const name = document.getElementById('userName').value.trim();
        if(!id || !name) return alert("Please specify both ID and Name.");

        // If the proximity loop is running in standby, pull it to full power for registration
        if (video.style.opacity === "0.15") {
            clearInterval(motionDetectionInterval);
            video.style.opacity = "1.0";
            statusText.innerText = "📸 Ready to register. Face the camera and click again.";
            return;
        }

        statusText.innerText = "📸 Capturing biometric profile... Hold steady.";
        
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 }))
                                       .withFaceLandmarks()
                                       .withFaceDescriptor();

        if (!detection) {
            statusText.innerText = "❌ Face not found. Look directly at the lens and try again.";
            return;
        }

        const tx = db.transaction("users", "readwrite");
        tx.objectStore("users").put({ id, name, descriptor: Array.from(detection.descriptor) });

        tx.oncomplete = () => {
            statusText.innerText = `✅ Registered: ${name} saved locally!`;
            document.getElementById('userId').value = '';
            document.getElementById('userName').value = '';
            
            // Re-trigger standard low-power standby mode tracking loop
            const stream = video.srcObject;
            if(stream) startProximitySensing(stream);
        };
    });

    // 6. Hands-Free Automated Scanning Engine (LOCAL CHRONOLOGICAL TIMELINE)
    async function runFaceVerification(stream) {
        statusText.innerText = "👁️ AI Active. Processing facial vectors...";
        let attempts = 0;
        const maxAttempts = 8;

        const checkInterval = setInterval(async () => {
            attempts++;
            
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 }))
                                           .withFaceLandmarks()
                                           .withFaceDescriptor();

            if (detection) {
                clearInterval(checkInterval); // Halt evaluation cycle immediately
                
                const tx = db.transaction(["users", "logs"], "readwrite");
                
                tx.objectStore("users").getAll().onsuccess = (e) => {
                    const users = e.target.result;
                    let bestMatch = null;
                    let lowestDistance = 1.0; 

                    users.forEach(user => {
                        const distance = faceapi.euclideanDistance(detection.descriptor, new Float32Array(user.descriptor));
                        if (distance < 0.5 && distance < lowestDistance) {
                            lowestDistance = distance;
                            bestMatch = user;
                        }
                    });

                    // Scenario A: Profile Found
                    if (bestMatch) {
                        const logStore = tx.objectStore("logs");
                        
                        logStore.getAll().onsuccess = (logEvent) => {
                            const allLogs = logEvent.target.result;
                            const userLogs = allLogs
                                .filter(l => l.userId === bestMatch.id)
                                .sort((a, b) => new Date(a.loginTime) - new Date(b.loginTime));
                            
                            let currentDirection = "IN"; 
                            if (userLogs.length > 0) {
                                const lastLog = userLogs[userLogs.length - 1];
                                currentDirection = (lastLog.direction === "IN") ? "OUT" : "IN";
                            }

                            const now = new Date();
                            const logEntry = {
                                userId: bestMatch.id,
                                userName: bestMatch.name,
                                loginTime: now.toISOString(),               
                                formattedTime: now.toLocaleTimeString(),    
                                formattedDate: now.toLocaleDateString(),
                                direction: currentDirection, 
                                synced: true 
                            };

                            logStore.put(logEntry);

                            tx.oncomplete = () => {
                                const actionText = currentDirection === "IN" ? "logged IN 🟢" : "logged OUT 🔴";
                                statusText.innerText = `🎉 Hi ${bestMatch.name}, you ${actionText} at ${logEntry.formattedTime}!`;
                                
                                // Pause for 4 seconds so the user can read it, then reset to standby
                                setTimeout(() => {
                                    startProximitySensing(stream);
                                }, 4000);
                            };
                        };
                    } 
                    // Scenario B: Vector anomaly / Strangers
                    else {
                        statusText.innerText = "❌ Profile details unrecognized.";
                        setTimeout(() => {
                            startProximitySensing(stream);
                        }, 2500);
                    }
                };
                return;
            }

            // Fallback timeout if a person walks away mid-scan frame block execution
            if (attempts >= maxAttempts) {
                clearInterval(checkInterval);
                statusText.innerText = "⏳ Session expired. Re-entering standby sleep mode.";
                setTimeout(() => {
                    startProximitySensing(stream);
                }, 1500);
            }
        }, 1000); // Scan every 1 second when active
    }
</script>

</body>
</html>
